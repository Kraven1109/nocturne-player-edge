name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: site
    attributes:
      label: Site
      description: The page the video was on. Leave blank if you would rather not.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Microsoft Edge & OS version
      placeholder: 'Edge 156 on Linux / Windows 11'
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Confirm
      options:
        - label: Verified with extension built from the latest main branch or store zip
          required: true
